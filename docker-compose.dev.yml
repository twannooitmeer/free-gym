name: free-gym-dev

# Development database only. The app runs on the host:
#
#   docker compose -f docker-compose.dev.yml up -d
#   cp .env.example .env      # DATABASE_URL already matches the defaults below
#   pnpm dev
#
# The defaults are for a throwaway local database and are never used by
# docker-compose.yml, which requires real credentials. The port is bound to
# 127.0.0.1 only; set POSTGRES_PORT if 5432 is taken on your machine.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: freegym
      POSTGRES_PASSWORD: freegym-dev-only
      POSTGRES_DB: free_gym
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freegym -d free_gym"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
